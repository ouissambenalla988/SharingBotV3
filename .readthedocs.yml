# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Build documentation with MkDocs
mkdocs:
  configuration: mkdocs.yml

# Build PDF & ePub
formats:
  - pdf
  - epub

# Build configuration
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

# Python requirements
python:
  install:
    - requirements: requirements.txt
